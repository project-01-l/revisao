<title>UECE 2027.1 — Revisão de Emergência</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#5d6b7a;--bd:#e1e5ea;--ac:#2456d6;--acs:#e8eefc;--ok:#13795b;--oks:#e3f5ee;--er:#b3261e;--ers:#fdeceb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12161c;--card:#1a2029;--tx:#e8ecf1;--mu:#98a4b2;--bd:#2b3441;--ac:#7ea2ff;--acs:#1f2a45;--ok:#4cc9a0;--oks:#12312a;--er:#ff8a80;--ers:#3a1d1b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161c;--card:#1a2029;--tx:#e8ecf1;--mu:#98a4b2;--bd:#2b3441;--ac:#7ea2ff;--acs:#1f2a45;--ok:#4cc9a0;--oks:#12312a;--er:#ff8a80;--ers:#3a1d1b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:1040px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:230px 1fr}
@media(max-width:780px){.app{grid-template-columns:1fr}}
aside{position:sticky;top:12px;align-self:start}
@media(max-width:780px){aside{position:static}}
.brand{font-weight:700;font-size:18px;margin:4px 0 2px}.sub{color:var(--mu);font-size:13px;margin-bottom:12px}
.list{display:flex;flex-direction:column;gap:4px}
@media(max-width:780px){.list{flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.list button{all:unset;cursor:pointer;padding:8px 12px;border-radius:10px;font-size:14px;white-space:nowrap;display:flex;justify-content:space-between;gap:8px;color:var(--tx)}
.list button:hover{background:var(--acs)}.list button.on{background:var(--ac);color:#fff}
.list small{opacity:.75}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:20px;margin:0}h3{font-size:16px;margin:0 0 4px}
.mu{color:var(--mu)}.sm{font-size:13px}
.tabs{display:flex;gap:6px;margin:14px 0;border-bottom:1px solid var(--bd);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-size:14px;border-bottom:2px solid transparent;color:var(--mu);white-space:nowrap}
.tabs button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.topic{border:1px solid var(--bd);border-radius:12px;padding:14px;background:var(--card)}
.topic h3{color:var(--ac)}.topic p{margin:0}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--acs);color:var(--ac);margin-right:6px}
.box{background:var(--acs);border-left:4px solid var(--ac);padding:12px 14px;border-radius:8px;margin-bottom:12px}
.q{border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--card)}
.q p{margin:0 0 10px}.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.opt:hover:not(:disabled){border-color:var(--ac)}.opt.ok{background:var(--oks);border-color:var(--ok)}.opt.er{background:var(--ers);border-color:var(--er)}
.fb{margin-top:8px;padding:10px 12px;border-radius:8px;font-size:14px}.fb.ok{background:var(--oks)}.fb.er{background:var(--ers)}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin:6px 0 2px}.bar span{display:block;height:100%;background:var(--ac)}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.stat div{flex:1;min-width:110px;text-align:center;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
.stat b{display:block;font-size:24px;color:var(--ac)}
.btn{font:inherit;cursor:pointer;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 14px}.btn.g{background:var(--acs);color:var(--ac)}
.gab{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.gab b{color:var(--ok);min-width:26px}
.note{font-size:12.5px;color:var(--mu);margin-top:14px}
button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{box-shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.04)}
.ex{border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--card)}
.ex p{margin:8px 0}.steps{margin:6px 0 10px;padding-left:20px}.steps li{margin:4px 0}
.lock{text-align:center;padding:34px 16px;border:1px dashed var(--bd);border-radius:12px;background:var(--bg)}.lock p{color:var(--mu);margin:6px 0 14px}
.list small{font-variant-numeric:tabular-nums}

.timer{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);font-size:14px}
.timer b{font-variant-numeric:tabular-nums;font-size:16px;flex:1}
.timer button{font:inherit;font-size:12px;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:3px 8px}
.sig{margin-top:12px;font-style:italic;color:var(--mu);font-size:14px}
.res{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;margin:6px 0;font-size:14px}.res .bar{margin:0}
ul.tips{padding-left:20px}ul.tips li{margin:7px 0}
@media print{.timer{display:none}aside,.tabs,.btn{display:none}.app{display:block}}

<script>
const D=[{"id": 0, "name": "Língua Portuguesa", "full": "Língua Portuguesa", "n": 12, "pr": "Muito alta", "prn": "Muito alta — maior número de questões", "topics": [["Leitura e interpretação", "Identifique tema, tese, finalidade, público-alvo, pressupostos, ironia, implícitos e relação entre texto verbal e visual. Diferencie informação explícita de inferência."], ["Gêneros e argumentação", "Observe quem fala, para quem, com qual objetivo e em que contexto. Em textos argumentativos, localize tese, argumentos, evidências, contra-argumentos e conclusão."], ["Gramática em contexto", "Revise classes de palavras, concordância, regência, crase, pontuação, pronomes, conectivos, colocação e efeitos de sentido. A função no contexto importa mais que decorar listas."], ["Literatura", "Leia o texto literário considerando linguagem, narrador, personagens, contexto histórico, estilo, imagens e intertextualidade. O edital inclui literaturas brasileira (incluindo cearense, indígena e afro-brasileira), portuguesa e africanas de língua portuguesa."]], "lembrar": "Tese + argumentos + conclusão. “Embora/apesar de” = concessão. Inferência só vale se o texto sustentar.", "qs": [{"q": "Em um artigo, o autor apresenta dados sobre a falta de áreas verdes e conclui que o município deve ampliar parques públicos. A conclusão funciona principalmente como:", "o": ["uma descrição neutra", "uma proposta defendida a partir dos argumentos", "uma informação sem relação com a tese", "uma citação literária"], "c": 1, "e": "A conclusão retoma a argumentação e propõe uma ação; não é apenas descrição."}, {"q": "Na frase “Embora o projeto seja caro, seus benefícios são duradouros”, a palavra “embora” expressa:", "o": ["causa", "concessão", "conclusão", "finalidade"], "c": 1, "e": "“Embora” introduz uma concessão: reconhece um obstáculo sem impedir a ideia principal."}, {"q": "Sobre o artigo de opinião, analise as assertivas. I. O autor defende um ponto de vista com argumentos e dados. II. Predomina a linguagem literária, sem compromisso com a argumentação. III. O objetivo central é convencer o leitor. Estão corretas:", "o": ["I e III, apenas", "I e II, apenas", "II e III, apenas", "I, II e III"], "c": 0, "e": "Artigo de opinião é um gênero argumentativo: tese, argumentos e persuasão. A assertiva II é falsa."}], "ex": [{"q": "Em um artigo, o autor afirma logo no primeiro parágrafo que o uso de celulares deve ser proibido em sala de aula e, depois, apresenta dados e exemplos. Essa afirmação inicial funciona como:", "s": "Identifique a ideia central que o autor quer provar.|Ela aparece logo no início, e os dados vêm depois para sustentá-la.|Aquilo que será defendido ao longo do texto é a tese.|Resposta: tese (o ponto de vista defendido)."}, {"q": "Em “Estudou muito; por isso, foi aprovado”, a expressão “por isso” indica:", "s": "Separe as duas ideias: estudou muito / foi aprovado.|A primeira é a causa e a segunda é o resultado.|“Por isso” introduz o resultado, ou seja, a conclusão.|Resposta: conclusão (consequência)."}, {"q": "Sobre o texto instrucional (como um manual), analise. I. Predomina a narração de fatos passados. II. Usa verbos no imperativo ou no infinitivo para orientar. III. Visa orientar o leitor na execução de uma tarefa. Estão corretas:", "s": "Avalie cada assertiva separadamente.|I é falsa (narrar o passado é típico da narrativa). II e III são verdadeiras.|Procure a alternativa que combina só as verdadeiras.|Resposta: II e III, apenas."}]}, {"id": 1, "name": "Matemática", "full": "Matemática", "n": 10, "pr": "Muito alta", "prn": "Muito alta — maior número de questões depois de Português", "topics": [["Aritmética e porcentagem", "Converta porcentagem em fração decimal. Aumento de p%: valor × (1+p/100); desconto de p%: valor × (1−p/100). Em variações sucessivas, aplique cada fator separadamente."], ["Álgebra e funções", "Revise equações e sistemas, produtos notáveis, fatoração, função afim y=ax+b e função quadrática y=ax²+bx+c. Interprete raízes, coeficientes, vértice e gráficos."], ["Geometria e medidas", "Área do triângulo = base×altura/2; retângulo = base×altura; círculo = πr². Pitágoras: a²+b²=c² no triângulo retângulo. Atenção às unidades."], ["Estatística e probabilidade", "Média = soma dos valores/número de valores. Probabilidade em casos equiprováveis = casos favoráveis/casos possíveis. Leia tabelas e gráficos com cuidado."]], "lembrar": "Desconto: × (1 − p/100). Pitágoras: a² = b² + c². Média = soma ÷ quantidade. P = favoráveis ÷ possíveis.", "qs": [{"q": "Um produto custa R$ 240 e recebe desconto de 25%. Qual é o preço final?", "o": ["R$ 60", "R$ 180", "R$ 200", "R$ 215"], "c": 1, "e": "25% de 240 = 60. Então 240 − 60 = R$ 180."}, {"q": "Um triângulo retângulo tem catetos de 6 cm e 8 cm. A hipotenusa mede:", "o": ["7 cm", "10 cm", "12 cm", "14 cm"], "c": 1, "e": "Pelo teorema de Pitágoras: c²=6²+8²=36+64=100; c=10 cm."}, {"q": "Os três primeiros termos de uma progressão aritmética são 3, 7 e 11. A soma dos 10 primeiros termos é:", "o": ["190", "210", "230", "390"], "c": 1, "e": "r = 4; a₁₀ = 3 + 9·4 = 39; S = 10·(3 + 39)/2 = 210."}], "ex": [{"q": "Um produto custa R$ 300 e recebe desconto de 20%. Qual é o preço final?", "s": "Calcule o desconto: 20% de 300 = 0,20 × 300 = 60.|Subtraia: 300 − 60 = 240.|Atalho: fator 0,80 × 300 = 240.|Resposta: R$ 240."}, {"q": "Um triângulo retângulo tem catetos de 5 cm e 12 cm. A hipotenusa mede:", "s": "Use Pitágoras: c² = a² + b².|c² = 5² + 12² = 25 + 144 = 169.|c = √169 = 13.|Resposta: 13 cm."}, {"q": "Os três primeiros termos de uma PA são 2, 5 e 8. A soma dos 8 primeiros termos é:", "s": "Razão: r = 5 − 2 = 3.|Último termo: a₈ = 2 + 7·3 = 23.|Soma: S = 8·(2 + 23)/2 = 100.|Resposta: 100."}]}, {"id": 2, "name": "Biologia", "full": "Biologia", "n": 8, "pr": "Alta", "prn": "Alta — 8 questões", "topics": [["Ecologia", "Domine níveis de organização, cadeias e teias alimentares, fluxo de energia, ciclos da matéria, relações ecológicas, sucessão, populações e impactos ambientais. Energia diminui a cada nível trófico."], ["Citologia e metabolismo", "Compare células procariontes e eucariontes, organelas e membranas. Fotossíntese armazena energia química; respiração celular libera energia utilizável (ATP). Enzimas aceleram reações."], ["Genética e evolução", "Revise DNA, genes, alelos, genótipo/fenótipo, mitose/meiose, herança mendeliana e mutações. Seleção natural altera frequências de características herdáveis ao longo das gerações."], ["Fisiologia e diversidade", "Funções dos sistemas humanos, homeostase, imunidade, reprodução, classificação, adaptação e características gerais de vírus, bactérias, fungos, plantas e animais."]], "lembrar": "Produtor → consumidores → decompositores. Meiose reduz à metade e gera variabilidade. Energia cai a cada nível.", "qs": [{"q": "Em uma cadeia capim → gafanhoto → sapo → cobra, o capim é:", "o": ["consumidor primário", "decompositor", "produtor", "consumidor terciário"], "c": 2, "e": "Plantas produzem matéria orgânica por fotossíntese e ocupam o nível de produtores."}, {"q": "A meiose é importante porque:", "o": ["produz duas células geneticamente idênticas sempre", "reduz à metade o número de cromossomos e contribui para variabilidade", "ocorre apenas em bactérias", "não envolve divisão celular"], "c": 1, "e": "A meiose forma células haploides e, por recombinação e segregação, contribui para a variabilidade."}, {"q": "Sobre os vírus, marque V ou F. ( ) São acelulares. ( ) Possuem metabolismo próprio. ( ) Dependem de uma célula hospedeira para se reproduzir. A sequência correta é:", "o": ["V, F, V", "F, V, F", "V, V, F", "F, F, V"], "c": 0, "e": "Vírus não têm células nem metabolismo próprio e só se multiplicam dentro de células hospedeiras."}], "ex": [{"q": "Na cadeia alga → peixe pequeno → peixe grande → ave, o peixe pequeno é:", "s": "Comece pela base: a alga é o produtor.|Quem se alimenta diretamente do produtor? O peixe pequeno.|Esse é o primeiro nível de consumidor.|Resposta: consumidor primário."}, {"q": "A mitose é importante porque, em geral:", "s": "Lembre: mitose gera células iguais; meiose gera células com metade dos cromossomos.|A mitose serve para crescimento e regeneração.|Resultado: duas células geneticamente idênticas.|Resposta: produz duas células geneticamente idênticas, para crescimento e reparo."}, {"q": "Sobre os fungos, marque V ou F. ( ) São procariontes. ( ) São heterótrofos. ( ) Possuem parede celular de quitina.", "s": "Julgue cada item sozinho.|1º: F, fungos são eucariontes. 2º: V, absorvem nutrientes do ambiente. 3º: V, a parede é de quitina.|Monte a sequência na ordem do enunciado.|Resposta: F, V, V."}]}, {"id": 3, "name": "Física", "full": "Física", "n": 8, "pr": "Alta", "prn": "Alta — 8 questões", "topics": [["Cinemática", "Velocidade média = deslocamento/tempo; aceleração média = variação da velocidade/tempo. Em gráficos, inclinação e área podem representar grandezas físicas: confira os eixos."], ["Dinâmica e energia", "Força resultante = massa×aceleração (F=ma). Peso = massa×g. Trabalho de força constante paralela = F×d; energia cinética = mv²/2; energia potencial gravitacional = mgh."], ["Calor e ondas", "Diferencie calor de temperatura; calor sensível Q=mcΔT. Ondas: v=λf. Som precisa de meio material; ondas eletromagnéticas podem propagar-se no vácuo."], ["Eletricidade", "Lei de Ohm: U=Ri. Potência elétrica P=Ui. Em série, a corrente é a mesma; em paralelo, a tensão é a mesma nos ramos ideais."]], "lembrar": "v = Δs/Δt · F = m·a · U = R·i · P = U·i · v = λ·f · Ec = mv²/2.", "qs": [{"q": "Um ciclista percorre 45 km em 3 h. Sua velocidade média é:", "o": ["15 km/h", "30 km/h", "45 km/h", "135 km/h"], "c": 0, "e": "Velocidade média = distância/tempo = 45/3 = 15 km/h."}, {"q": "Um resistor de 4 Ω é submetido a uma tensão de 12 V. A corrente é:", "o": ["0,3 A", "3 A", "8 A", "48 A"], "c": 1, "e": "Pela lei de Ohm, I=U/R=12/4=3 A."}, {"q": "Um carro de 1000 kg se move a 20 m/s. Sua energia cinética, em joules, é:", "o": ["20 000", "100 000", "200 000", "400 000"], "c": 2, "e": "Ec = m·v²/2 = 1000·400/2 = 200 000 J."}], "ex": [{"q": "Um ônibus percorre 120 km em 2 h. Sua velocidade média é:", "s": "Fórmula: v = distância ÷ tempo.|v = 120 ÷ 2.|Confira a unidade: km/h.|Resposta: 60 km/h."}, {"q": "Um resistor de 5 Ω é submetido a 20 V. A corrente é:", "s": "Lei de Ohm: U = R·i, logo i = U/R.|i = 20 ÷ 5.|Confira a unidade: ampère.|Resposta: 4 A."}, {"q": "Um ciclista com sua bicicleta, 80 kg no total, anda a 5 m/s. Sua energia cinética é:", "s": "Fórmula: Ec = m·v²/2.|v² = 25, então Ec = 80·25/2.|Ec = 2000/2 = 1000.|Resposta: 1000 J."}]}, {"id": 4, "name": "Química", "full": "Química", "n": 8, "pr": "Alta", "prn": "Alta — 8 questões", "topics": [["Matéria e tabela periódica", "Revise substâncias e misturas, separação de misturas, estados físicos, modelos atômicos, número atômico (prótons), massa aproximada (prótons+nêutrons) e tendências periódicas."], ["Ligações e funções", "Ligações iônicas envolvem transferência de elétrons; covalentes, compartilhamento. Reconheça ácidos, bases, sais e óxidos e relacione estrutura e propriedades."], ["Reações e estequiometria", "Balanceie equações conservando átomos. Use proporções entre coeficientes; quando houver cálculos, converta massa em mol: n=m/M."], ["Soluções, energia e ambiente", "Concentração comum C=m(soluto)/V(solução). Revise diluição, pH, reações endotérmicas/exotérmicas, oxidação-redução, química orgânica e impactos ambientais."]], "lembrar": "Z = prótons (= elétrons se neutro). Coeficientes = proporção. n = m/M. C = m₁/V.", "qs": [{"q": "O número atômico de um átomo neutro é 11. Quantos prótons e elétrons ele possui?", "o": ["11 prótons e 10 elétrons", "10 prótons e 11 elétrons", "11 prótons e 11 elétrons", "22 prótons e 11 elétrons"], "c": 2, "e": "Número atômico = prótons. Em átomo neutro, prótons = elétrons."}, {"q": "Na reação balanceada 2H₂ + O₂ → 2H₂O, 2 moléculas de H₂ reagem estequiometricamente com:", "o": ["1 molécula de O₂", "2 moléculas de O₂", "3 moléculas de O₂", "4 moléculas de O₂"], "c": 0, "e": "Os coeficientes indicam a proporção 2:1:2."}, {"q": "Dada a massa molar da água, 18 g/mol, quantos mols há em 36 g de H₂O?", "o": ["1 mol", "2 mol", "4 mol", "18 mol"], "c": 1, "e": "n = m/M = 36/18 = 2 mol."}], "ex": [{"q": "O número atômico de um átomo neutro é 17. Quantos prótons e elétrons ele possui?", "s": "Número atômico = número de prótons.|Átomo neutro tem prótons = elétrons.|Logo, 17 prótons e 17 elétrons.|Resposta: 17 prótons e 17 elétrons."}, {"q": "Na reação balanceada N₂ + 3H₂ → 2NH₃, 1 molécula de N₂ reage com:", "s": "Leia os coeficientes: 1 : 3 : 2.|O coeficiente do H₂ é 3.|A proporção é de molécula para molécula.|Resposta: 3 moléculas de H₂."}, {"q": "Quantos mols há em 90 g de H₂O? (M = 18 g/mol)", "s": "Fórmula: n = m/M.|n = 90 ÷ 18.|Confira a unidade: mol.|Resposta: 5 mol."}]}, {"id": 5, "name": "História", "full": "História", "n": 8, "pr": "Alta", "prn": "Alta — 8 questões", "topics": [["Brasil colonial e Império", "Revise colonização, escravidão indígena e africana, economia exportadora, mineração, independência, Primeiro Reinado, Regências, Segundo Reinado e abolição."], ["República e Brasil contemporâneo", "Relacionar República Velha, Era Vargas, ditadura militar, redemocratização e Constituição de 1988 a conflitos sociais, economia e cidadania."], ["História geral", "Antiguidade e medievo, Renascimento, reformas religiosas, expansão marítima, revoluções burguesas, Revolução Industrial, imperialismo, guerras mundiais e Guerra Fria."], ["Como interpretar fontes", "Analise autoria, data, contexto, público e intenção de documentos, imagens, mapas e discursos. Evite julgar o passado sem considerar seu contexto histórico."]], "lembrar": "Lei Áurea: 13/05/1888. República: 1889. Fonte histórica: autoria, contexto, finalidade.", "qs": [{"q": "A Lei Áurea, que aboliu juridicamente a escravidão no Brasil, foi assinada em:", "o": ["1822", "1850", "1888", "1889"], "c": 2, "e": "A Lei Áure tivo:", "s": "Descartes duvida de tudo o que pode ser posto em dúvida.|Não é para ficar no ceticismo: é um método.|Ele busca algo que resista à dúvida: “penso, logo existo”.|Resposta: encontrar uma certeza indubitável."}, {"q": "Um argumento dedutivo é válido quando:", "s": "Separe premissas e conclusão.|Validade trata da forma do raciocínio, não da verdade das premissas.|Se as premissas fossem verdadeiras, a conclusão não poderia ser falsa.|Resposta: a conclusão decorre logicamente das premissas."}, {"q": "Para Aristóteles, o ser humano é, por natureza, um:", "s": "Lembre a ideia clássica da Política.|O ser humano realiza sua natureza vivendo na pólis.|Daí o termo grego zoon politikon.|Resposta: animal político (social)."}]}, {"id": 8, "name": "Sociologia", "full": "Sociologia", "n": 5, "pr": "Média", "prn": "Média — 5 questões", "topics": [["Cultura e socialização", "Cultura inclui valores, normas, símbolos, práticas e conhecimentos aprendidos. Socialização ocorre em família, escola, grupos, mídia e outras instituições."], ["Clássicos da Sociologia", "Durkheim: fatos sociais e coesão; Marx: classes, trabalho e conflito; Weber: ação social, sentido e dominação. Não reduza cada autor a uma única palavra."], ["Desigualdade e poder", "Revise classe, raça, gênero, estratificação, mobilidade, ideologia, Estado, cidadania, movimentos sociais e direitos."], ["Trabalho e sociedade", "Industrialização, divisão do trabalho, precarização, tecnologia, consumo e transformações das relações de trabalho podem ser analisados sociologicamente."]], "lembrar": "Durkheim: fato social (exterior, geral, coercitivo). Marx: classes e meios de produção. Weber: ação social.", "qs": [{"q": "Para Émile Durkheim, fatos sociais são caracterizados por serem, em geral:", "o": ["puramente individuais e biológicos", "exteriores ao indivíduo e dotados de poder coercitivo", "sempre escolhidos livremente por cada pessoa", "fenômenos exclusivamente naturais"], "c": 1, "e": "Durkheim destaca exterioridade, generalidade e coercitividade dos fatos sociais."}, {"q": "Na perspectiva de Karl Marx, o conflito entre classes está ligado especialmente:", "o": ["à ausência de relações econômicas", "às relações de produção e à distribuição dos meios de produção", "somente a diferenças de clima", "a escolhas individuais sem estrutura social"], "c": 1, "e": "Marx analisa classes a partir das relações de produção e das disputas sobre propriedade e trabalho."}, {"q": "Para Max Weber, a ação social é:", "o": ["um reflexo biológico involuntário", "uma conduta com sentido atribuído pelo agente e orientada a outras pessoas", "um fato exterior e coercitivo ao indivíduo", "uma lei econômica inevitável"], "c": 1, "e": "Weber define ação social pelo sentido subjetivo e pela orientação ao comportamento de outros. A alternativa C descreve o fato social de Durkheim."}], "ex": [{"q": "Para Durkheim, nas sociedades tradicionais, pouco diferenciadas, a coesão social se baseia na:", "s": "Nelas os indivíduos são parecidos, com crenças e tarefas semelhantes.|Durkheim chama essa coesão de solidariedade mecânica.|Com a divisão do trabalho complexa, surge a solidariedade orgânica.|Resposta: solidariedade mecânica."}, {"q": "Para Marx, no capitalismo, o proletariado é a classe que:", "s": "Pergunte: o que o trabalhador tem para trocar?|Ele não possui os meios de produção, só a capacidade de trabalhar.|Por isso vende essa capacidade em troca de salário.|Resposta: vende sua força de trabalho em troca de salário."}, {"q": "Para Weber, a dominação baseada na crença nas qualidades extraordinárias de um líder é a:", "s": "Weber descreve três tipos: tradicional, carismática e legal-racional.|Qualidades extraordinárias do líder indicam carisma.|Tradição seria costume antigo; legal seria regra impessoal.|Resposta: dominação carismática."}]}, {"id": 9, "name": "Educação Física", "full": "Educação Física", "n": 5, "pr": "Média", "prn": "Média — 5 questões", "topics": [["Cultura corporal", "Esportes, jogos, da m de profissionalização.|O foco é a participação e o prazer.|Resposta: participação (lazer)."}, {"q": "O sedentarismo é caracterizado por:", "s": "Relembre: atividade física é qualquer movimento que gasta energia.|Sedentarismo é o oposto desse hábito.|É a ausência ou a insuficiência de atividade física regular.|Resposta: falta ou pouca prática regular de atividade física."}, {"q": "A capacidade de sustentar um esforço por tempo prolongado, como correr 5 km sem parar, é a:", "s": "O foco é a duração do esforço.|Força trabalharia carga; flexibilidade trabalharia amplitude.|Manter o esforço por muito tempo é resistência.|Resposta: resistência (aeróbia)."}]}, {"id": 10, "name": "Língua Estrangeira", "full": "Língua Estrangeira (Inglês, Espanhol ou Francês)", "n": 8, "pr": "Alta", "prn": "Alta — 8 questões", "topics": [["Estratégias de leitura", "Leia primeiro título, fonte e pergunta. Use cognatos com cuidado, palavras repetidas, conectores e contexto. Não traduza palavra por palavra."], ["Conectores e sentido", "Reconheça oposição/concessão (although, however; aunque, sin embargo; bien que, cependant), causa (because, porque, parce que) e conclusão."], ["Referência e inferência", "Identifique pronomes e seus referentes, ideia principal, tom, propósito, informação explícita e inferências sustentadas pelo texto."], ["Gramática em contexto", "Revise tempos verbais frequentes, pronomes, comparativos, negação e marcadores temporais. Priorize entender a mensagem geral e a relação entre ideias."]], "lembrar": "Although / aunque / bien que = concessão. However / sin embargo / cependant = contraste.", "qs": [{"q": "No trecho em inglês “Although the plan was expensive, it worked”, “although” indica:", "o": ["causa", "concessão/contraste", "tempo futuro", "finalidade"], "c": 1, "e": "“Although” significa “embora”: apresenta uma concessão ou contraste."}, {"q": "Em espanhol, a expressão “sin embargo” normalmente indica:", "o": ["adição", "contraste", "causa", "lugar"], "c": 1, "e": "“Sin embargo” equivale a “no entanto/contudo” e marca contraste."}, {"q": "No trecho “Tom told Ana that he would call her after work”, o pronome “her” refere-se a:", "o": ["Tom", "Ana", "work", "the call"], "c": 1, "e": "“Her” é pronome feminino e retoma Ana, a pessoa que receberá a ligação."}], "ex": [{"q": "Em “She was tired because she worked all night”, “because” indica:", "s": "Traduza: “ela estava cansada porque trabalhou a noite toda”.|Trabalhar a noite toda explica o cansaço.|“Because” introduz a explicação.|Resposta: causa."}, {"q": "Em espanhol, em “Estudio mucho, por eso aprobé”, a expressão “por eso” indica:", "s": "Traduza: “estudo muito, por isso passei”.|Estudar muito leva ao resultado: ser aprovado.|“Por eso” introduz a consequência.|Resposta: conclusão (consequência)."}, {"q": "Em “Paul told Mia that he would help her”, o pronome “he” refere-se a:", "s": "“He” é masculino singular.|Entre Paul e Mia, quem é masculino? Paul.|Mia é retomada por “her”.|Resposta: Paul."}]}];const LINKS=[["Edital oficial","https://www.cev.uece.br/wp-content/uploads/2026/08/edital052026cev.pdf"],["Prova 2025.2 (PDF)","https://comentario.fariasbrito.com.br/upload/files/1745781313.764725044.pdf"],["Prova anterior (2026.1)","https://www.cev.uece.br/2025/10/12/prova-de-conhecimentos-gerais-1a-fase-do-vestibular-2026-1/"]];

 const pct=Math.round(100*s.c/s.a),err=s.a-s.c;
 const per=D.map(d=>({d,c:d.qs.filter((q,j)=>ans[key(d.id,j)]===q.c).length,n:d.qs.length}));
 const weak=per.filter(p=>p.c<=1).sort((a,b)=>b.d.n-a.d.n),mid=per.filter(p=>p.c===2);
 const tier=pct>=85?'Desempenho excelente. Agora é manter o ritmo, revisar só os pontos fracos e descansar.':pct>=60?'Bom desempenho, com espaço para subir. Foque nos erros e nas matérias com mais questões na prova.':'Ainda há bastante o que consolidar. Priorize as matérias abaixo e use as abas Exemplos antes de refazer as questões.';
 const avg=Math.round(tsec/tot);
 return `<div class="card"><span class="tag">🏁 Resolução final</span><h2>Seu resultado</h2>
 <div class="stat"><div><b>${s.c}/${s.a}</b>acertos (${pct}%)</div><div><b>${err}</b>erros</div><div><b>${fmt(tsec)}</b>tempo total</div><div><b>${fmt(avg)}</b>média por questão</div></div>
 <h3 style="margin-top:14px">Desempenho por matéria</h3>${per.map(p=>`<div class="res"><span>${p.d.name}</span><div class="bar"><span style="width:${100*p.c/p.n}%"></span></div><b>${p.c}/${p.n}</b></div>`).join('')}
 <h3 style="margin-top:16px">Orientações</h3><ul class="tips">
 <li>${tier}</li>
 ${weak.length?`<li><b>Revisar primeiro</b> (as de maior peso na prova vêm antes): ${weak.map(p=>`<button class="btn g" style="margin:2px" onclick="go(${p.d.id})">${p.d.name} · ${p.c}/${p.n}</button>`).join('')}</li>`:''}
 ${mid.length?`<li><b>Quase lá:</b> ${mid.map(p=>p.d.name).join(', ')}. Releia o resumo e refaça só o que errou.</li>`:''}
 ${err?`<li>Abra <a href="#" onclick="go(99);return false">Meus erros</a> e escreva uma linha com o motivo de cada um: faltou conteúdo, atenção ou interpretação?</li>`:''}
 <li>Nas matérias fracas, leia a aba Exemplos e use “Refazer questões”.</li>
 <li>Seu tempo inclui leitura e estudo. Na prova real são 85 questões em 4 horas, cerca de 2min49s por questão: não trave em uma só.</li>
 <li>Antes de dormir: separe documento original com foto e caneta transparente de tinta preta, confira o cartão de informação e confirme tudo no edital.</li></ul>
 <p class="sig">${FRASE}</p></div>`}
function render0(){const m=$('#main');
 if(cur===98){m.innerHTML=result();return}
 if(cur<0){const s=stats(),mx=Math.max(...D.map(d=>d.n));
  m.innerHTML=`<div class="card"><span class="tag">${days()}</span><span class="tag">18/10/2026 · 9h15–13h15</span><h1>Revisão de Emergência</h1><p class="mu">Guia independente com 11 disciplinas: resumo, exemplos resolvidos, questões e gabarito. Escolha uma matéria ao lado.</p>
  <div class="stat"><div><b>85</b>questões na prova</div><div><b>${s.a}/${tot}</b>respondidas</div><div><b>${s.a?Math.round(100*s.c/s.a)+'%':'—'}</b>de acerto</div></div>
  <h3>Distribuição por disciplina</h3>${D.map(d=>`<div style="cursor:pointer" onclick="go(${d.id})"><div class="sm"><b>${d.name}</b> <span class="mu">${d.n} questões · ${d.pr}</span></div><div class="bar"><span style="width:${100*d.n/mx}%"></span></div></div>`).join('')}
  <h3 style="margin-top:16px">Plano das últimas horas</h3><ol class="mu"><li>Leia o resumo e os lembretes de cada matéria.</li><li>Responda as questões antes de ver a explicação.</li><li>Revise “Meus erros” e durma bem.</li></ol>
  <p>${LINKS.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener" class="tag">${l[0]} ↗</a>`).join('')}</p>
  <p class="note">Material independente, sem vínculo com a UECE. As questões são autorais, no formato das provas anteriores da UECE (4 alternativas, afirmativas I/II/III, V/F) e a ordem de prioridade não prevê o que cairá. Confira seu cartão de informação.</p><p class="sig">Criado por Erik Douglas. ${FRASE}</p></div>`;return}
 if(cur===99){const w=[];D.forEach(d=>d.qs.forEach((q,j)=>{const v=ans[key(d.id,j)];if(v!==undefined&&v!==q.c)w.push([d,q,v])}));
  m.innerHTML=`<div class="card"><h2>Meus erros</h2><p class="mu">Releia, entenda o motivo e volte ao tópico.</p>${w.length?w.map(([d,q,v])=>`<div class="q"><span class="tag">${d.name}</span><p>${q.q}</p><div class="fb er">Você marcou: <b>${L[v]}</b> ${q.o[v]}</div><div class="fb ok" style="margin-top:6px">Correta: <b>${L[q.c]}</b> ${q.o[q.c]}<br>${q.e}</div></div>`).join(''):'<p>Nenhum erro registrado ainda. Faça questões nas matérias.</p>'}<button class="btn g" onclick="ans={};tsec=0;save();saveT();nav();render()">Zerar progresso</button></div>`;return}
 const d=D[cur];
 const body={resumo:`<div class="box"><b>Lembrar na hora:</b> ${d.lembrar}</div><div class="grid">${d.topics.map(t=>`<div class="topic"><h3>${t[0]}</h3><p>${t[1]}</p></div>`).join('')}</div>`,
 questoes:d.qs.map((q,j)=>{const v=ans[key(d.id,j)];return `<div class="q"><p><b>Questão ${j+1}.</b> ${q.q}</p>${q.o.map((o,k)=>`<button class="opt ${v!==undefined?(k===q.c?'ok':k===v?'er':''):''}" ${v!==undefined?'disabled':''} onclick="pick(${d.id},${j},${k})"><b>${L[k]}</b> ${o}</button>`).join('')}${v!==undefined?`<div class="fb ${v===q.c?'ok':'er'}"><b>${v===q.c?'Correto.':'Resposta certa: '+L[q.c]+'.'}</b> ${q.e}</div>`:''}</div>`}).join(''),
 exemplos:d.ex.map((x,j)=>`<div class="ex"><span class="tag">Exemplo ${j+1} · parecido com a Questão ${j+1}</span><p>${x.q}</p><b>Como resolver</b><ol class="steps">${x.s.split('|').slice(0,-1).map(t=>`<li>${t}</li>`).join('')}</ol><div class="fb ok">${x.s.split('|').pop()}</div></div>`).join(''),
 gabarito:!done(d)?`<div class="lock"><b>🔒 Gabarito bloqueado</b><p>Responda as ${d.qs.length} questões de ${d.name} para liberar. Faltam ${d.qs.length-got(d)}.</p><button class="btn" onclick="tab='questoes';render()">Ir para as questões</button></div>`:d.qs.map((q,j)=>`<div class="gab"><b>${j+1}·${L[q.c]}</b><div><div>${q.q}</div><div class="sm mu"><b>${q.o[q.c]}</b> — ${q.e}</div></div></div>`).join('')};
 m.innerHTML=`<div class="card"><span class="tag">${d.n} questões na prova</span><span class="tag">Prioridade: ${d.pr}</span><h2>${d.full}</h2><div class="bar"><span style="width:${100*got(d)/d.qs.length}%"></span></div><div class="sm mu">${got(d)}/${d.qs.length} questões respondidas</div><div class="tabs">${[['resumo','Resumo'],['exemplos','Exemplos'],['questoes','Questões'],['gabarito',done(d)?'Gabarito':'Gabarito 🔒']].map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${body[tab]}${tab==='questoes'&&got(d)?`<button class="btn g" onclick="redo(${d.id})">Refazer questões</button>`:''}</div>`}
function redo(i){D[i].qs.forEach((q,j)=>delete ans[key(i,j)]);save();nav();render()}
function pick(i,j,k){ans[key(i,j)]=k;save();saveT();nav();render()}
nav();render();setInterval(tick,1000);
</script></body></html>
